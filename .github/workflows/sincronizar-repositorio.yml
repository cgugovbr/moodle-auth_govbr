name: Sincronizar para cgugovbr

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    # Executa somente no repositório de origem; o destino não dispara o espelhamento.
    if: github.repository == 'cgu-se-dti/moodle-auth_govbr'
    runs-on: ubuntu-24.04
    steps:
      - name: Gerar token do App na origem
        id: src
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REPO_SYNC_APP_ID }}
          private-key: ${{ secrets.REPO_SYNC_PRIVATE_KEY }}
          owner: cgu-se-dti
          repositories: moodle-auth_govbr

      - name: Gerar token do App no destino
        id: dst
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REPO_SYNC_APP_ID }}
          private-key: ${{ secrets.REPO_SYNC_PRIVATE_KEY }}
          owner: cgugovbr
          repositories: moodle-auth_govbr

      - name: Espelhar branches e tags
        env:
          SRC_TOKEN: ${{ steps.src.outputs.token }}
          DST_TOKEN: ${{ steps.dst.outputs.token }}
        run: |
          set -euo pipefail
          git clone --mirror \
            "https://x-access-token:${SRC_TOKEN}@github.com/cgu-se-dti/moodle-auth_govbr.git" \
            mirror.git
          git -C mirror.git push --prune \
            "https://x-access-token:${DST_TOKEN}@github.com/cgugovbr/moodle-auth_govbr.git" \
            'refs/heads/*:refs/heads/*'
          git -C mirror.git push \
            "https://x-access-token:${DST_TOKEN}@github.com/cgugovbr/moodle-auth_govbr.git" \
            'refs/tags/*:refs/tags/*'

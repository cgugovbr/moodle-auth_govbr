name: Sincronizar para cgugovbr

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  sync:
    # O workflow é replicado no destino; execute-o somente em repositórios da
    # organização de origem para evitar uma sincronização recursiva.
    if: github.repository_owner == 'cgu-se-dti'
    runs-on: ubuntu-latest
    steps:
      - name: Gerar token do App na origem
        id: src
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REPO_SYNC_APP_ID }}
          private-key: ${{ secrets.REPO_SYNC_PRIVATE_KEY }}
          owner: cgu-se-dti
          repositories: moodle-auth_govbr

      - name: Gerar token do App no destino
        id: dst
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REPO_SYNC_APP_ID }}
          private-key: ${{ secrets.REPO_SYNC_PRIVATE_KEY }}
          owner: cgugovbr
          repositories: moodle-auth_govbr

      - name: Espelhar branch main e tags
        env:
          SRC_TOKEN: ${{ steps.src.outputs.token }}
          DST_TOKEN: ${{ steps.dst.outputs.token }}
        run: |
          set -euo pipefail
          SRC_AUTH=$(printf 'x-access-token:%s' "${SRC_TOKEN}" | base64 -w0)
          DST_AUTH=$(printf 'x-access-token:%s' "${DST_TOKEN}" | base64 -w0)

          git -c "http.extraHeader=Authorization: Basic ${SRC_AUTH}" \
            clone --mirror \
            "https://github.com/cgu-se-dti/moodle-auth_govbr.git" \
            mirror.git
          git -C mirror.git \
            -c "http.extraHeader=Authorization: Basic ${DST_AUTH}" \
            push --prune \
            "https://github.com/cgugovbr/moodle-auth_govbr.git" \
            '+refs/heads/main:refs/heads/main'
          git -C mirror.git \
            -c "http.extraHeader=Authorization: Basic ${DST_AUTH}" \
            push --prune \
            "https://github.com/cgugovbr/moodle-auth_govbr.git" \
            '+refs/tags/*:refs/tags/*'

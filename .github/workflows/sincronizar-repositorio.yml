name: Sincronizar para cgugovbr

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    # O workflow é replicado no destino; execute-o somente em repositórios da
    # organização de origem para evitar uma sincronização recursiva.
    if: github.repository_owner == 'cgu-se-dti'
    runs-on: ubuntu-latest
    steps:
      - name: Gerar token do App na origem
        id: src
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REPO_SYNC_APP_ID }}
          private-key: ${{ secrets.REPO_SYNC_PRIVATE_KEY }}
          owner: cgu-se-dti
          repositories: moodle-auth_govbr

      - name: Gerar token do App no destino
        id: dst
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REPO_SYNC_APP_ID }}
          private-key: ${{ secrets.REPO_SYNC_PRIVATE_KEY }}
          owner: cgugovbr
          repositories: moodle-auth_govbr

      - name: Espelhar branches e tags
        env:
          SRC_TOKEN: ${{ steps.src.outputs.token }}
          DST_TOKEN: ${{ steps.dst.outputs.token }}
        run: |
          set -euo pipefail
          git -c "http.extraHeader=Authorization: Bearer ${SRC_TOKEN}" \
            clone --mirror \
            "https://github.com/cgu-se-dti/moodle-auth_govbr.git" \
            mirror.git
          git -C mirror.git \
            -c "http.extraHeader=Authorization: Bearer ${DST_TOKEN}" \
            push --prune \
            "https://github.com/cgugovbr/moodle-auth_govbr.git" \
            'refs/heads/*:refs/heads/*'
          git -C mirror.git \
            -c "http.extraHeader=Authorization: Bearer ${DST_TOKEN}" \
            push --prune \
            "https://github.com/cgugovbr/moodle-auth_govbr.git" \
            'refs/tags/*:refs/tags/*'
